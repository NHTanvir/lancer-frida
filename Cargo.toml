[package]
name = "lancer-frida"
version = "0.1.0"
edition = "2021"
description = "Rust clone of frida — part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-frida"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
frida = { version = "0.17", features = ["auto-download"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ctrlc = "3"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
